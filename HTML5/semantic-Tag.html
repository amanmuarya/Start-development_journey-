<!-- Improves SEO (Search Engine Optimization) -->
<!DOCTYPE html>
<html>

<head>
    <title>Semantic Tags Example</title>
</head>

<body>

    <header style="background:lightblue; padding:15px; text-align:center;">
        Website Header <!-- Top section of website -->
    </header>

    <nav style="background:lightgreen; padding:10px; text-align:center;">
        Home | About | Contact <!-- Navigation links -->
    </nav>

    <main style="background:lightyellow; padding:15px;">

        <section style="background:lightpink; padding:10px; margin:10px 0;">
            Student Section <!-- Group of related content -->
        </section>

        <article style="background:lightgray; padding:10px; margin:10px 0;">
            Blog Article <!-- Independent content like blog/news -->
        </article>

        <aside style="background:orange; padding:10px; margin:10px 0;">
            Sidebar Content <!-- Side information or ads -->
        </aside>

        <figure style="background:white; padding:10px; border:2px solid black; text-align:center;">
            <img src="blog.jpg" width="300"hight="250"alt="Sample Image">

            <figcaption>
                Beautiful Image <!-- Caption for image -->
            </figcaption>
        </figure>

    </main>

    <footer style="background:black; color:white; padding:15px; text-align:center;">
       Blog websire @ aman<!-- Bottom/footer section -->
    </footer>

</body>

</html>
