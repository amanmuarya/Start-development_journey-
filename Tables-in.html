<!-- Tables in HTML -->
<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Tables in HTML</title>
   <!-- <style>
   col  {
      background-color: yellow;
   } -->
   <!-- </style> -->
</head>

<body>

   <!-- <table style="border: 1px solid black;"> -->
   <table border="">
      <caption>this is my table here now </caption>
      <colgroup>
         <col style="background-color:red " />
      </colgroup>

      <!-- Tr : table row -->
      <tr>
         <td>col - 1 </td>
         <td>col - 2</td>
         <td>col-3</td>
         <td>col- 4</td>
      </tr>
      <tr>
         <!-- Td; tables data  -->
         <td>1</td>
         <td>2</td>
         <td>3</td>
         <td>4</td>
      </tr>
      <tr>
         <td>5</td>
         <td>6</td>
         <td>6</td>
         <td>7</td>

      </tr>
      <tr>
         <td>8</td>
         <td>9</td>
         <td>10</td>
         <td>11</td>
         <tbody>
         <tfoot>
            <tr>
               <td>hello</td>
               <td>hay</td>
               <td>hii </td>
               <td>what's up </td>
            </tr>
         </tfoot>
         </tbody>



      </tr>
   </table>
</body>

</html>
